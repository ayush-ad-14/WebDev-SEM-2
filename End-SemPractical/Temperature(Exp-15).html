<!DOCTYPE html>
<html>
<head>
    <title>Temperature Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }

        .container {
            background: white;
            width: 350px;
            padding: 20px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }

        h2 {
            color: #333;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            color: green;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Temperature Converter</h2>

        <input type="number" id="celsius" placeholder="Enter temperature in Celsius">

        <br>

        <button onclick="convertTemp()">Convert</button>

        <div id="result"></div>
    </div>

    <script>
        function convertTemp() {
            let celsius = document.getElementById("celsius").value;
            let fahrenheit = (celsius * 9/5) + 32;

            document.getElementById("result").innerHTML =
                celsius + "°C = " + fahrenheit + "°F";
        }
    </script>

</body>
</html>
